<!DOCTYPE html>
<html lang="fr">

<head>
    <title>Formulaire - démo</title>
    <meta charset="utf-8" />
    <link rel="icon" type="image/gif" href="../../img/favicon.gif">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="../../css/style2.css" />
</head>

<body>
    <h2>Formulaire GET à compléter :</h2>
    <form action="formulaire_demo_ok.html" method="GET">
        <h2>Identité :</h2>
        <label for="nom">Nom</label> : <input type="text" name="nom" id="nom"><br />
        <label for="prenom">Prénom</label> : <input type="text" name="prenom" id="prenom"><br />
        <p>
            <input type="reset" value="RAZ" />
            <input type="submit" value="Envoyer (méthode GET)">
        </p>
    </form>


    <h2>Formulaire POST à compléter :</h2>
    <form action="formulaire_demo_ok.html" method="POST">
        <h2>Identité :</h2>
        <label for="ville">Ville</label> : <input type="text" name="ville" id="ville"><br />
        <label for="dpmt">Déparement</label> : <input type="text" name="departement" id="dpmt"><br />
        <p>
            <input type="reset" value="RAZ" />
            <input type="submit" value="Envoyer (méthode POST)">
        </p>
    </form>
 
</body>

</html>
